[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snapshotkit"
version = "0.1.0"
description = "History-free, secret-scanned source snapshots for air-gapped AI agents"
requires-python = ">=3.12"
dependencies = [
    # botocore 1.36.0: first release with request_checksum_calculation /
    # response_checksum_validation (PutObject IfNoneMatch dates from 1.35.36)
    "boto3>=1.36.0",
    "botocore>=1.36.0",
    "kubernetes",
    "mcp>=2.3,<3",
    "PyYAML",
    "regex",
]

[project.optional-dependencies]
dev = ["pytest", "yamllint"]

[project.scripts]
snapshot-publish = "snapshotkit.publish:main"
snapshot-alias = "snapshotkit.alias:main"
snapshot-retention = "snapshotkit.retention:main"
snapshot-mcp = "snapshotkit.mcp_server:main"
snapshot-transfer = "snapshotkit.transfer:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests needing external services",
    "gitleaks: tests needing the gitleaks binary",
]
