# MINIO_IMAGE should point at the internal registry mirror in the air-gapped harness.
# Default: Chainguard MinIO pinned by digest (the official minio/minio repo is no
# longer pullable). The image is distroless, so there is no container healthcheck;
# the test fixture polls the endpoint until ready.
services:
  minio:
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio@sha256:634c989a2f1029162fc2676c263caa181213b9410449968532f750a6fb77532d}
    command: ["server", "/data"]
    ports:
      - "9000:9000"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
