# Lives in the agent's namespace (overlay sets it). Anything not listed, including
# Azure DevOps and GitLab, is unreachable from the agent pods.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-egress
  namespace: ai-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ai-agent
  policyTypes: [Egress]
  egress:
    # Snapshot tool
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: code-snapshots
          podSelector:
            matchLabels:
              app.kubernetes.io/name: snapshot-mcp
      ports:
        - protocol: TCP
          port: 8080
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Model endpoint
    - to:
        - ipBlock:
            cidr: 203.0.113.0/24
      ports:
        - protocol: TCP
          port: 443
