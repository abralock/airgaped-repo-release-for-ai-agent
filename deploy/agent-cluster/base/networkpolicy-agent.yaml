# Lives in the agent's namespace (overlay sets it).
#
# NetworkPolicies are additive: a pod's allowed egress is the UNION of every policy
# that selects it. Before applying this, list the existing ones
# (`kubectl -n <agent-ns> get networkpolicy -o yaml`) and reconcile:
#  - an existing policy that allows broader egress for these pods defeats this one;
#  - if none exists, this policy blocks every other egress the agent needs (its L1
#    front end, auth, telemetry, ...): add those destinations in the overlay first.
# Azure DevOps and GitLab are unreachable from the agent pods only if no other policy
# allows wider egress for them, and only on a CNI that enforces NetworkPolicy.
# The MCP server has no authentication of its own: the ingress rule of the
# snapshot-tool policy is its access control.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-egress
  namespace: ai-agent
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ai-agent
  policyTypes: [Egress]
  egress:
    # Snapshot tool
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: code-snapshots
          podSelector:
            matchLabels:
              app.kubernetes.io/name: snapshot-mcp
      ports:
        - protocol: TCP
          port: 8080
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Model endpoint
    - to:
        - ipBlock:
            cidr: 203.0.113.0/24
      ports:
        - protocol: TCP
          port: 443
