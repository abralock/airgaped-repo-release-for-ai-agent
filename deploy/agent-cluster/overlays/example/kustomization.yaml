apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: snapshotkit
    newName: registry.example.internal/snapshotkit/snapshotkit
    newTag: "1.0.0"
# Everything below is EXAMPLE data: replace with your environment's values.
# The snapshot-clusters Secret keys cannot contain "/", so each cluster contributes
# keys like prod-a-ca.crt / prod-a-token, mapped to <name>/ca.crt and <name>/token.
patches:
  - target:
      kind: Deployment
      name: snapshot-mcp
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/0/secret/items/-
        value: {key: prod-a-ca.crt, path: prod-a/ca.crt}
      - op: add
        path: /spec/template/spec/volumes/0/secret/items/-
        value: {key: prod-a-token, path: prod-a/token}
  - target:
      kind: CronJob
      name: snapshot-retention
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/volumes/0/secret/items/-
        value: {key: prod-a-ca.crt, path: prod-a/ca.crt}
      - op: add
        path: /spec/jobTemplate/spec/template/spec/volumes/0/secret/items/-
        value: {key: prod-a-token, path: prod-a/token}
  # NetworkPolicy egress is replaced as a whole list (order-independent of the base).
  - target:
      kind: NetworkPolicy
      name: snapshot-tool
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: ai-agent
      - op: replace
        path: /spec/ingress/0/from/0/podSelector/matchLabels/app.kubernetes.io~1name
        value: ai-agent
      - op: replace
        path: /spec/egress
        value:
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
              podSelector:
                matchLabels:
                  k8s-app: kube-dns
          ports:
            - {protocol: UDP, port: 53}
            - {protocol: TCP, port: 53}
        - to:
            - ipBlock: {cidr: 10.20.0.5/32}
          ports:
            - {protocol: TCP, port: 9000}
        - to:
            - ipBlock: {cidr: 10.30.0.10/32}
            - ipBlock: {cidr: 10.31.0.10/32}
          ports:
            - {protocol: TCP, port: 6443}
  - target:
      kind: NetworkPolicy
      name: agent-egress
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: ai-agent
      - op: replace
        path: /spec/egress
        value:
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: code-snapshots
              podSelector:
                matchLabels:
                  app.kubernetes.io/name: snapshot-mcp
          ports:
            - {protocol: TCP, port: 8080}
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: kube-system
              podSelector:
                matchLabels:
                  k8s-app: kube-dns
          ports:
            - {protocol: UDP, port: 53}
            - {protocol: TCP, port: 53}
        - to:
            - ipBlock: {cidr: 10.40.0.0/28}
          ports:
            - {protocol: TCP, port: 443}
