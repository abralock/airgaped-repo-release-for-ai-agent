apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: snapshotkit
    newName: registry.example.internal/snapshotkit/snapshotkit
    newTag: "1.0.0"
# Everything below is EXAMPLE data: replace with your environment's values.
# The snapshot-clusters Secret keys cannot contain "/", so each cluster contributes
# keys like prod-a-ca.crt / prod-a-token, mapped to <name>/ca.crt and <name>/token.
patches:
  - target:
      kind: Deployment
      name: snapshot-mcp
    patch: |-
      - op: add
        path: /spec/template/spec/volumes/0/secret/items/-
        value: {key: prod-a-ca.crt, path: prod-a/ca.crt}
      - op: add
        path: /spec/template/spec/volumes/0/secret/items/-
        value: {key: prod-a-token, path: prod-a/token}
  - target:
      kind: CronJob
      name: snapshot-retention
    patch: |-
      - op: add
        path: /spec/jobTemplate/spec/template/spec/volumes/0/secret/items/-
        value: {key: prod-a-ca.crt, path: prod-a/ca.crt}
      - op: add
        path: /spec/jobTemplate/spec/template/spec/volumes/0/secret/items/-
        value: {key: prod-a-token, path: prod-a/token}
  - target:
      kind: NetworkPolicy
      name: snapshot-tool
    patch: |-
      - op: replace
        path: /spec/ingress/0/from/0/namespaceSelector/matchLabels/kubernetes.io~1metadata.name
        value: ai-agent
      - op: replace
        path: /spec/ingress/0/from/0/podSelector/matchLabels/app.kubernetes.io~1name
        value: ai-agent
      - op: replace
        path: /spec/egress/1/to/0/ipBlock/cidr
        value: 10.20.0.5/32
      - op: replace
        path: /spec/egress/1/ports/0/port
        value: 9000
      - op: replace
        path: /spec/egress/2/to/0/ipBlock/cidr
        value: 10.30.0.10/32
  # prod-b API server (second cluster in clusters.yaml)
  - target:
      kind: NetworkPolicy
      name: snapshot-tool
    patch: |-
      - op: add
        path: /spec/egress/2/to/-
        value: {ipBlock: {cidr: 10.31.0.10/32}}
  - target:
      kind: NetworkPolicy
      name: agent-egress
    patch: |-
      - op: replace
        path: /metadata/namespace
        value: ai-agent
      - op: replace
        path: /spec/egress/2/to/0/ipBlock/cidr
        value: 10.40.0.0/28
      - op: replace
        path: /spec/egress/2/ports/0/port
        value: 443
